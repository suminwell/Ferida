name: Build

# O-MVLL is enabled by default for Android builds using the refreshed plugin release.
on:
  schedule:
    - cron: "0 9/12 * * *"
  workflow_dispatch:
  push:
    branches: ["ceen", "ci"]
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"

jobs:
  check_version:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    outputs:
      FRIDA_VERSION: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
      ALREADY_RELEASE: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE }}
    steps:
      - name: Pull Frida Latest Release
        id: pullFridaLatestRelease
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const releaseResponse = await github.rest.repos.getLatestRelease({
              owner: 'frida',
              repo: 'frida',
            })
            const {
              data: { tag_name: ver }
            } = releaseResponse;
            core.setOutput('FRIDA_VERSION', ver);

      - name: Split Repository Name
        id: split_name
        run: |
          repo_name=${{ github.repository }}
          IFS='/' read -ra repo_parts <<< "$repo_name"
          echo "owner=${repo_parts[0]}" >> $GITHUB_OUTPUT
          echo "repo=${repo_parts[1]}" >> $GITHUB_OUTPUT

      - name: Check release version
        id: checkReleaseVersion
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            try {
              const releaseVersion = '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'
              const releaseResponse = await github.rest.repos.getReleaseByTag({
                owner: '${{ steps.split_name.outputs.owner }}',
                repo: '${{ steps.split_name.outputs.repo }}',
                tag: releaseVersion
              });
              const {
                data: { tag_name: ver }
              } = releaseResponse;
              if (ver == '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'){
                  if ( ${{ ( github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}){
                    core.setOutput('ALREADY_RELEASE', '2');
                  } else {
                    core.setOutput('ALREADY_RELEASE', '1');
                  }
              }
              else{
                  core.setOutput('ALREADY_RELEASE', '0');
              }
            } catch (e) {
              if(e.message == 'Not Found'){
                core.setOutput('ALREADY_RELEASE', '0');
              }
              else{
                core.setFailed(e.message);
              }
            }

      - name: Delete release
        if: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE == '2' }}
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

  create_release:
    needs: check_version
    runs-on: ubuntu-22.04
    if: needs.check_version.outputs.ALREADY_RELEASE != '1'
    permissions:
      contents: write

    steps:
      - uses: softprops/action-gh-release@v2.1.0
        id: createRelease
        name: Create Runner Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          prerelease: false

  android_build:
    runs-on: ubuntu-22.04
    needs: [check_version, create_release]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29
        local-cache: false
        link-to-sdk: true

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib

    - name: Setup O-MVLL
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "$GITHUB_WORKSPACE/o-mvll-dist"
        GH_TOKEN="${{ github.token }}" gh release download \
          --repo suminwell/o-mvll \
          --pattern 'omvll_v*_linux.tar.gz' \
          --dir "$GITHUB_WORKSPACE/o-mvll-dist"
        tar xzf "$GITHUB_WORKSPACE"/o-mvll-dist/omvll_v*_linux.tar.gz \
          --directory="$GITHUB_WORKSPACE/o-mvll-dist"

        OMVLL_PLUGIN="$GITHUB_WORKSPACE/o-mvll-dist/omvll-ndk-r29.so"
        OMVLL_CONFIG="$GITHUB_WORKSPACE/o-mvll-dist/sample-omvll-config.py"
        OMVLL_PYTHONPATH="$GITHUB_WORKSPACE/o-mvll-dist/Python-3.10.7/Lib"

        echo "OMVLL_PLUGIN=$OMVLL_PLUGIN" >> "$GITHUB_ENV"
        echo "OMVLL_CONFIG=$OMVLL_CONFIG" >> "$GITHUB_ENV"
        echo "OMVLL_PYTHONPATH=$OMVLL_PYTHONPATH" >> "$GITHUB_ENV"
        echo "PYTHONHOME=" >> "$GITHUB_ENV"
        echo "OMVLL_FLAGS=" >> "$GITHUB_ENV"
        echo "Using O-MVLL plugin: $OMVLL_PLUGIN"
        echo "Using O-MVLL config: $OMVLL_CONFIG"
        echo "Using O-MVLL Python path: $OMVLL_PYTHONPATH"

    - name: build frida for Android
      shell: bash
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

        git clone --recurse-submodules https://github.com/frida/frida
        cd frida
        for path in ../patches/*
        do
          name=$(basename $path)
          real=$(realpath $path)
          echo "Apply patches in $real to frida/subprojects/$name"
          cd subprojects/$name
          git am ../../../patches/$name/*.patch
          cd ../..
          echo $i
        done
        cd ..

        ARCHES="android-arm android-arm64 android-x86 android-x86_64"
        for ARCH in $ARCHES
        do
          mkdir build-$ARCH
          cd build-$ARCH
          ../frida/configure --host=$ARCH
          make
          cd ..
        done

    - name: Split Repository Name
      id: split_name
      run: |
        repo_name=${{ github.repository }}
        IFS='/' read -ra repo_parts <<< "$repo_name"
        echo "owner=${repo_parts[0]}" >> $GITHUB_OUTPUT
        echo "repo=${repo_parts[1]}" >> $GITHUB_OUTPUT

    - name: Check release version
      id: checkReleaseVersion
      uses: actions/github-script@v7
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          try {
            const releaseVersion = '${{ needs.check_version.outputs.FRIDA_VERSION }}'
            const releaseResponse = await github.rest.repos.getReleaseByTag({
              owner: '${{ steps.split_name.outputs.owner }}',
              repo: '${{ steps.split_name.outputs.repo }}',
              tag: releaseVersion
            })
            const {
              data: { id: releaseId, html_url: htmlUrl, upload_url: uploadUrl }
            } = releaseResponse;
            core.setOutput('id', releaseId);
            core.setOutput('html_url', htmlUrl);
            core.setOutput('upload_url', uploadUrl);
            core.setOutput('version', releaseVersion);
          } catch (e) {
            core.setFailed(e.message);
          }

    - name: package build result for Android
      shell: bash
      run: |

        gzip build-android-arm/subprojects/frida-core/server/frida-server
        gzip build-android-arm64/subprojects/frida-core/server/frida-server
        gzip build-android-x86/subprojects/frida-core/server/frida-server
        gzip build-android-x86_64/subprojects/frida-core/server/frida-server

        gzip build-android-arm/subprojects/frida-core/inject/frida-inject
        gzip build-android-arm64/subprojects/frida-core/inject/frida-inject
        gzip build-android-x86/subprojects/frida-core/inject/frida-inject
        gzip build-android-x86_64/subprojects/frida-core/inject/frida-inject

        gzip build-android-arm/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip build-android-x86/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip build-android-x86_64/subprojects/frida-core/lib/gadget/frida-gadget.so

        gzip build-android-arm/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a
        gzip build-android-arm64/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a
        gzip build-android-x86/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a
        gzip build-android-x86_64/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a


    - name: Upload Android release assets
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
      run: |
        set -euo pipefail

        mkdir -p release-assets
        cp build-android-arm/subprojects/frida-core/server/frida-server.gz "release-assets/ferida-server-$VERSION-android-arm.gz"
        cp build-android-arm64/subprojects/frida-core/server/frida-server.gz "release-assets/ferida-server-$VERSION-android-arm64.gz"
        cp build-android-x86/subprojects/frida-core/server/frida-server.gz "release-assets/ferida-server-$VERSION-android-x86.gz"
        cp build-android-x86_64/subprojects/frida-core/server/frida-server.gz "release-assets/ferida-server-$VERSION-android-x86_64.gz"

        cp build-android-arm/subprojects/frida-core/inject/frida-inject.gz "release-assets/ferida-inject-$VERSION-android-arm.gz"
        cp build-android-arm64/subprojects/frida-core/inject/frida-inject.gz "release-assets/ferida-inject-$VERSION-android-arm64.gz"
        cp build-android-x86/subprojects/frida-core/inject/frida-inject.gz "release-assets/ferida-inject-$VERSION-android-x86.gz"
        cp build-android-x86_64/subprojects/frida-core/inject/frida-inject.gz "release-assets/ferida-inject-$VERSION-android-arm-x86_64.gz"

        cp build-android-arm/subprojects/frida-core/lib/gadget/frida-gadget.so.gz "release-assets/ferida-gadget-$VERSION-android-arm.so.gz"
        cp build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so.gz "release-assets/ferida-gadget-$VERSION-android-arm64.so.gz"
        cp build-android-x86/subprojects/frida-core/lib/gadget/frida-gadget.so.gz "release-assets/ferida-gadget-$VERSION-android-x86.so.gz"
        cp build-android-x86_64/subprojects/frida-core/lib/gadget/frida-gadget.so.gz "release-assets/ferida-gadget-$VERSION-android-x86_64.so.gz"

        cp build-android-arm/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a.gz "release-assets/ferida-gumjs-$VERSION-android-arm.a.gz"
        cp build-android-arm64/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a.gz "release-assets/ferida-gumjs-$VERSION-android-arm64.a.gz"
        cp build-android-x86/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a.gz "release-assets/ferida-gumjs-$VERSION-android-x86.a.gz"
        cp build-android-x86_64/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a.gz "release-assets/ferida-gumjs-$VERSION-android-x86_64.a.gz"

        gh release upload "$VERSION" release-assets/* --clobber
